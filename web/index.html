<!DOCTYPE html>
<html lang="uk">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Особистий облік фінансів">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- PFinance: on, so the bottom bar can reach the rounded screen corners (iPhone). -->
  <!-- maximum-scale=1: iOS must not zoom the page when the phone turns, or the
       picture and the touch points drift apart. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PFinance">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#111318">
  <style>
    html, body { background: #111318; }
    /* The page itself never scrolls: after a rotation iOS can leave it
       scrolled down, which shifts the app away from where taps land. */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { position: fixed; inset: 0; }
    @media (prefers-color-scheme: light) { html, body { background: #F2F3F7; } }
  </style>

  <title>PFinance</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // After the phone turns (or the orientation lock is toggled), put the
    // page back to the top so the picture and the touch points match again.
    (function () {
      function reset() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      }
      function later() { reset(); setTimeout(reset, 100); setTimeout(reset, 400); }
      window.addEventListener('orientationchange', later);
      window.addEventListener('resize', later);
      window.addEventListener('pageshow', later);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', later);
      // Flutter replaces the viewport tag on start with one that allows
      // zoom up to 5x; keep zoom off so a rotation cannot leave it zoomed.
      var vp = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
      function fixViewport() {
        document.querySelectorAll('meta[name=viewport]').forEach(function (m) {
          if (m.content !== vp) m.content = vp;
        });
      }
      new MutationObserver(fixViewport).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
